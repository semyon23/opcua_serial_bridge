
opc_ua:
  endpoint: opc.tcp://192.168.163.158:4840
  security_mode: none
  username: ""
  timeout_ms: 5000
  publishing_interval_ms: 50
  lifetime_count: 600               
  keep_alive_count: 20

  keep_alive_node: "ns=4;s=|var|Inovance-PLC.Application.gvlPnp.keepAlive"
  keep_alive_period_ms: 500

  device_node_pattern: "ns=4;s=|var|Inovance-PLC.Application.gvlPnp.ManipulatorPorts[{port}].Manipulator[{device}]"
  max_nodes_per_request: 100         # лимит сервера на узлы в одном запросе (у AC810 около 100); пачка статусов делится по нему

serial_defaults:
  baud_rate: 115200
  parity: none
  stop_bits: 1
  response_timeout_ms: 20            # ответ платы после конца запроса (на 115200 он приходит за ~4 мс)
  reopen_delay_ms: 2000              # порт пропал или не открылся — пробовать снова через столько
  status_poll_ms: 100                # круг опроса порта: GET_STATUS всем платам раз в столько.
                                     # У отдельной платы можно задать свой период — округлится до целых кругов
  poll_schedule: fixed               # fixed — круги ровно по сетке 0, 100, 200 мс…, команды их не сдвигают;
                                     # after_reply — следующий круг через status_poll_ms после конца прошлого
  offline_after: 3                   # столько тайм-аутов подряд — плата offline
  offline_poll_ms: 1000              # опрос платы, которая не отвечает (тоже в кругах, разные платы — в разных)
  status_refresh_ms: 1000            # статус в ПЛК пишется только при изменении, но не реже чем раз в столько
  status_flush_ms: 0                 # 0 — статусы плат порта пишутся в ПЛК одной пачкой в конце каждого круга опроса;
                                     # > 0 — пачкой по своему таймеру раз в столько. Ответ на команду — всегда сразу.
                                     # poll_schedule и status_flush_ms можно задать и у отдельного порта

ports:
  - index: 1
    path: /tmp/ttySim23 #/dev/ttyUSB0
    devices:
      - {address: 1}
      - {address: 2}
      - {address: 3}
      - {address: 4}
      - {address: 5}
      - {address: 6}
      - {address: 7}
      - {address: 8}
      - {address: 9}
      - {address: 10}
  - index: 2
    path: /tmp/ttySim24 #/dev/ttyUSB0
    devices:
      - {address: 1}
      - {address: 2}
      - {address: 3}
      - {address: 4}
      - {address: 5}
      - {address: 6}
      - {address: 7}
      - {address: 8}
      - {address: 9}
      - {address: 10}

